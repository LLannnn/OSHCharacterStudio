name: Local regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/timeline.test.js && node tests/samples.test.js && node tests/descriptions.test.js && node tests/warnings.test.js
      - run: node --check web/app.js && node --check web/timeline.js && node --check web/review-timeline.js
      - run: git diff --check
